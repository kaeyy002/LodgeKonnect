<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — LodgeKonnect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/brand.css">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;z-index:1;}
.auth-card{width:100%;max-width:520px;padding:40px;background:rgba(18,19,36,0.92);border:1px solid var(--border);border-radius:var(--r-xl);backdrop-filter:var(--blur);box-shadow:var(--shadow-glow),var(--shadow-card);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo a{font-family:var(--font-display);font-size:1.8rem;font-weight:800;background:var(--grad-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}
.auth-logo p{color:var(--text-muted);font-size:0.85rem;margin-top:5px;}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-full);padding:4px;margin-bottom:28px;}
.type-btn{padding:10px;border-radius:var(--r-full);border:none;background:transparent;color:var(--text-secondary);font-family:var(--font-display);font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;gap:7px;}
.type-btn.active{background:var(--grad-btn);color:#fff;box-shadow:var(--shadow-btn);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.input-wrap{position:relative;}
.input-wrap i.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem;pointer-events:none;}
.input-wrap input,.input-wrap select{padding-left:40px;}
.input-wrap .toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);cursor:pointer;}
.step-panel{display:none;}.step-panel.active{display:block;}
.step-indicator{display:flex;align-items:center;gap:0;margin-bottom:28px;}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:0.8rem;border:2px solid var(--border);color:var(--text-muted);transition:all 0.3s;flex-shrink:0;}
.step-dot.active{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:var(--shadow-btn);}
.step-dot.done{background:var(--g-success);border-color:transparent;color:#fff;}
.step-line{flex:1;height:2px;background:var(--border);transition:background 0.3s;}
.step-line.done{background:var(--g-success);}
.section-tag{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--g-mid);margin-bottom:14px;margin-top:4px;}
.pw-strength{height:4px;border-radius:2px;margin-top:6px;background:var(--border);overflow:hidden;}
.pw-strength-bar{height:100%;border-radius:2px;transition:width 0.4s,background 0.4s;width:0%;}
.auth-foot{text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-muted);}
.auth-foot a{color:var(--g-mid);text-decoration:none;font-weight:600;}
.caretaker-fields{display:none;}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html">⬡ LodgeKonnect</a>
      <p>Create your free account</p>
    </div>

    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-dot active" id="dot-1">1</div>
      <div class="step-line" id="line-1"></div>
      <div class="step-dot" id="dot-2">2</div>
      <div class="step-line" id="line-2"></div>
      <div class="step-dot" id="dot-3">3</div>
    </div>

    <!-- Type toggle -->
    <div class="type-toggle">
      <button class="type-btn active" id="btn-student" onclick="setType('student')"><i class="fas fa-graduation-cap"></i> I'm a student</button>
      <button class="type-btn" id="btn-caretaker" onclick="setType('caretaker')"><i class="fas fa-building"></i> I'm a caretaker</button>
    </div>

    <form id="signupForm">

      <!-- Step 1: Personal info -->
      <div class="step-panel active" id="step-1">
        <div class="section-tag"><i class="fas fa-user"></i> Personal details</div>
        <div class="form-group">
          <label>Full name</label>
          <div class="input-wrap"><i class="fas fa-user icon"></i><input type="text" id="full_name" placeholder="e.g. Adaeze Nwosu" required></div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Email</label>
            <div class="input-wrap"><i class="fas fa-envelope icon"></i><input type="email" id="email" placeholder="you@email.com" required></div>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <div class="input-wrap"><i class="fas fa-phone icon"></i><input type="tel" id="phone" placeholder="08012345678" required></div>
          </div>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <div class="input-wrap"><i class="fas fa-venus-mars icon"></i>
            <select id="gender" required>
              <option value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>
        <button type="button" class="btn btn-primary w-full" style="justify-content:center;border-radius:var(--r-full);padding:14px;" onclick="nextStep(1)">
          Continue <i class="fas fa-arrow-right"></i>
        </button>
      </div>

      <!-- Step 2: Role-specific info -->
      <div class="step-panel" id="step-2">
        <!-- Student fields -->
        <div id="student-fields">
          <div class="section-tag"><i class="fas fa-graduation-cap"></i> Academic details</div>
          <div class="grid-2">
            <div class="form-group">
              <label>Department</label>
              <div class="input-wrap"><i class="fas fa-university icon"></i><input type="text" id="department" placeholder="e.g. Computer Science"></div>
            </div>
            <div class="form-group">
              <label>Level</label>
              <div class="input-wrap"><i class="fas fa-layer-group icon"></i>
                <select id="level">
                  <option value="">Select level</option>
                  <option value="100L">100 Level</option>
                  <option value="200L">200 Level</option>
                  <option value="300L">300 Level</option>
                  <option value="400L">400 Level</option>
                  <option value="500L">500 Level</option>
                </select>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Monthly budget for accommodation (₦)</label>
            <div class="input-wrap"><i class="fas fa-naira-sign icon"></i><input type="number" id="budget" placeholder="e.g. 80000" min="0"></div>
          </div>
        </div>

        <!-- Caretaker fields -->
        <div id="caretaker-fields" class="caretaker-fields">
          <div class="section-tag"><i class="fas fa-building"></i> Lodge details</div>
          <div class="form-group">
            <label>Lodge name</label>
            <div class="input-wrap"><i class="fas fa-building icon"></i><input type="text" id="lodge_name" placeholder="e.g. Golden Gate Hostel"></div>
          </div>
          <div class="form-group">
            <label>Location</label>
            <div class="input-wrap"><i class="fas fa-map-pin icon"></i>
              <select id="location">
                <option value="">Select location</option>
                <option value="eziobodo">Eziobodo</option>
                <option value="umuchima">Umuchima</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Brief description of your lodge</label>
            <textarea id="lodge_description" placeholder="Describe your lodge — rooms, water supply, electricity, security..."></textarea>
          </div>
        </div>

        <div class="flex gap-2 mt-2">
          <button type="button" class="btn btn-ghost" style="border-radius:var(--r-full);" onclick="prevStep(2)"><i class="fas fa-arrow-left"></i> Back</button>
          <button type="button" class="btn btn-primary" style="flex:1;justify-content:center;border-radius:var(--r-full);padding:14px;" onclick="nextStep(2)">Continue <i class="fas fa-arrow-right"></i></button>
        </div>
      </div>

      <!-- Step 3: Password -->
      <div class="step-panel" id="step-3">
        <div class="section-tag"><i class="fas fa-lock"></i> Set your password</div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="password" placeholder="At least 8 characters" oninput="checkStrength(this.value)">
            <i class="fas fa-eye toggle-pw" onclick="togglePw('password',this)"></i>
          </div>
          <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
          <span id="pwLabel" style="font-size:0.75rem;color:var(--text-muted);margin-top:3px;display:block;"></span>
        </div>
        <div class="form-group">
          <label>Confirm password</label>
          <div class="input-wrap">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="confirm_password" placeholder="Repeat your password">
            <i class="fas fa-eye toggle-pw" onclick="togglePw('confirm_password',this)"></i>
          </div>
        </div>

        <div class="flex gap-2 mt-2">
          <button type="button" class="btn btn-ghost" style="border-radius:var(--r-full);" onclick="prevStep(3)"><i class="fas fa-arrow-left"></i> Back</button>
          <button type="submit" class="btn btn-primary" id="submitBtn" style="flex:1;justify-content:center;border-radius:var(--r-full);padding:14px;">
            <span id="btnText">Create account</span> <i class="fas fa-check" id="btnIcon"></i>
          </button>
        </div>
      </div>
    </form>

    <div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
let userType = 'student';
let currentStep = 1;

function setType(t) {
  userType = t;
  document.getElementById('btn-student').classList.toggle('active', t === 'student');
  document.getElementById('btn-caretaker').classList.toggle('active', t === 'caretaker');
  document.getElementById('student-fields').style.display = t === 'student' ? 'block' : 'none';
  document.getElementById('caretaker-fields').style.display = t === 'caretaker' ? 'block' : 'none';
}

function goToStep(n) {
  document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('step-' + n).classList.add('active');
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById('dot-' + i);
    dot.classList.toggle('active', i === n);
    dot.classList.toggle('done', i < n);
    if (i < 3) document.getElementById('line-' + i).classList.toggle('done', i < n);
  }
  currentStep = n;
}

function nextStep(from) {
  if (from === 1) {
    const name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const gender = document.getElementById('gender').value;
    if (!name) return toast('Enter your full name', 'error');
    if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Enter a valid email', 'error');
    if (!/^\d{10,11}$/.test(phone)) return toast('Phone must be 10–11 digits', 'error');
    if (!gender) return toast('Select your gender', 'error');
  }
  if (from === 2) {
    if (userType === 'caretaker') {
      if (!document.getElementById('lodge_name').value.trim()) return toast('Enter your lodge name', 'error');
      if (!document.getElementById('location').value) return toast('Select a location', 'error');
      if (!document.getElementById('lodge_description').value.trim()) return toast('Add a brief description', 'error');
    }
  }
  goToStep(from + 1);
}
function prevStep(from) { goToStep(from - 1); }

function togglePw(id, icon) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  icon.className = el.type === 'password' ? 'fas fa-eye toggle-pw' : 'fas fa-eye-slash toggle-pw';
}

function checkStrength(pw) {
  const bar = document.getElementById('pwBar');
  const lbl = document.getElementById('pwLabel');
  const checks = [pw.length >= 8, /[A-Z]/.test(pw), /[0-9]/.test(pw), /[^A-Za-z0-9]/.test(pw)];
  const score = checks.filter(Boolean).length;
  const colors = ['#EF4444','#F59E0B','#10B981','#10B981'];
  const labels = ['Too short','Fair','Good','Strong 💪'];
  bar.style.width = (score * 25) + '%';
  bar.style.background = colors[score - 1] || '#EF4444';
  lbl.textContent = pw.length ? labels[score - 1] || 'Too short' : '';
  lbl.style.color = colors[score - 1] || 'var(--text-muted)';
}

document.getElementById('signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('password').value;
  const cpw = document.getElementById('confirm_password').value;
  if (pw.length < 8) return toast('Password must be at least 8 characters', 'error');
  if (pw !== cpw) return toast('Passwords do not match', 'error');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('btnText').textContent = 'Creating account…';
  document.getElementById('btnIcon').className = 'fas fa-spinner fa-spin';

  const body = {
    full_name: document.getElementById('full_name').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    gender: document.getElementById('gender').value,
    user_type: userType,
    password: pw,
    confirm_password: cpw,
  };

  if (userType === 'student') {
    body.department = document.getElementById('department').value.trim();
    body.level = document.getElementById('level').value;
  } else {
    body.lodge_name = document.getElementById('lodge_name').value.trim();
    body.location = document.getElementById('location').value;
    body.lodge_description = document.getElementById('lodge_description').value.trim();
  }

  try {
    const data = await API.post('/register.php', body);
    if (data.success) {
      toast('Account created! Redirecting to login…', 'success', 2500);
      setTimeout(() => location.href = 'login.html', 1800);
    } else {
      toast(data.error || 'Registration failed', 'error');
      btn.disabled = false;
      document.getElementById('btnText').textContent = 'Create account';
      document.getElementById('btnIcon').className = 'fas fa-check';
    }
  } catch {
    toast('Network error. Please try again.', 'error');
    btn.disabled = false;
    document.getElementById('btnText').textContent = 'Create account';
    document.getElementById('btnIcon').className = 'fas fa-check';
  }
});

if (Auth.get('token')) location.href = Auth.get('type') === 'caretaker' ? 'dashboardcaretaker.html' : 'dashboard.html';
</script>
</body>
</html>
