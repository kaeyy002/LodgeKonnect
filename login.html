<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — LodgeKonnect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/brand.css">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1;}
.auth-card{width:100%;max-width:440px;padding:40px;background:rgba(18,19,36,0.9);border:1px solid var(--border);border-radius:var(--r-xl);backdrop-filter:var(--blur);box-shadow:var(--shadow-glow),var(--shadow-card);}
.auth-logo{text-align:center;margin-bottom:32px;}
.auth-logo span{font-family:var(--font-display);font-size:2rem;font-weight:800;background:var(--grad-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.auth-logo p{color:var(--text-muted);font-size:0.88rem;margin-top:6px;}
.auth-card h2{font-size:1.5rem;margin-bottom:6px;}
.auth-sub{color:var(--text-secondary);font-size:0.88rem;margin-bottom:28px;}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-full);padding:4px;margin-bottom:24px;}
.type-btn{padding:10px;border-radius:var(--r-full);border:none;background:transparent;color:var(--text-secondary);font-family:var(--font-display);font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;gap:7px;}
.type-btn.active{background:var(--grad-btn);color:#fff;box-shadow:var(--shadow-btn);}
.input-wrap{position:relative;}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem;pointer-events:none;}
.input-wrap input{padding-left:40px;}
.input-wrap .toggle-pw{left:auto;right:14px;cursor:pointer;pointer-events:all;}
.divider{text-align:center;color:var(--text-muted);font-size:0.82rem;margin:20px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border);}
.divider::before{left:0;}.divider::after{right:0;}
.auth-foot{text-align:center;margin-top:20px;font-size:0.88rem;color:var(--text-muted);}
.auth-foot a{color:var(--g-mid);text-decoration:none;font-weight:600;}
.btn-submit{width:100%;padding:14px;font-size:1rem;justify-content:center;border-radius:var(--r-full);}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span>⬡ LodgeKonnect</span>
      <p>Your FUTO lodge & roommate finder</p>
    </div>
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to browse lodges and find roommates.</p>

    <!-- User type toggle -->
    <div class="type-toggle">
      <button class="type-btn active" id="btn-student" onclick="setType('student')"><i class="fas fa-graduation-cap"></i> Student</button>
      <button class="type-btn" id="btn-caretaker" onclick="setType('caretaker')"><i class="fas fa-building"></i> Caretaker</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email or Phone</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="loginId" name="loginId" placeholder="your@email.com or 0800..." autocomplete="username" required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <i class="fas fa-eye toggle-pw" id="togglePw" onclick="togglePassword()"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-submit" id="submitBtn">
        <span id="btnText">Log in</span>
        <i class="fas fa-arrow-right" id="btnIcon"></i>
      </button>
    </form>

    <div class="divider">or</div>
    <div class="auth-foot">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
let userType = 'student';

function setType(t) {
  userType = t;
  document.getElementById('btn-student').classList.toggle('active', t === 'student');
  document.getElementById('btn-caretaker').classList.toggle('active', t === 'caretaker');
}

function togglePassword() {
  const pw = document.getElementById('password');
  const icon = document.getElementById('togglePw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
  icon.className = pw.type === 'password' ? 'fas fa-eye toggle-pw' : 'fas fa-eye-slash toggle-pw';
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('btnText').textContent = 'Logging in…';
  document.getElementById('btnIcon').className = 'fas fa-spinner fa-spin';

  const loginId = document.getElementById('loginId').value.trim();
  const password = document.getElementById('password').value;

  try {
    const data = await API.post('/login.php', { loginId, password, userType });
    if (data.success) {
      Auth.set(data);
      toast('Welcome back, ' + data.user_name + '!', 'success', 2000);
      setTimeout(() => location.href = data.redirect, 800);
    } else {
      toast(data.error || 'Login failed', 'error');
      btn.disabled = false;
      document.getElementById('btnText').textContent = 'Log in';
      document.getElementById('btnIcon').className = 'fas fa-arrow-right';
    }
  } catch {
    toast('Network error. Please try again.', 'error');
    btn.disabled = false;
    document.getElementById('btnText').textContent = 'Log in';
    document.getElementById('btnIcon').className = 'fas fa-arrow-right';
  }
});

// Already logged in?
if (Auth.get('token')) location.href = Auth.get('type') === 'caretaker' ? 'dashboardcaretaker.html' : 'dashboard.html';
</script>
</body>
</html>
